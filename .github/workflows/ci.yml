name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-quality-gate:
    name: Full quality gate (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run full quality gate (unit + integration, core + experiments)
        run: mvn -B verify

      # 质量门禁引用的 5 个 WfFormat/WfInstances 小型输入已纳入版本库（见 .gitignore 白名单）。
      # 标准检出会执行相关测试；缺失必需输入会失败，不会自动跳过。
      # 其余大型语料不随仓库提供，仅用于显式准备语料后的扩展实验。
